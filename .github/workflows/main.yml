name: Run SPSE tests

on:
  workflow_dispatch:
    inputs:
      test_environment:
        description: Target environment
        required: true
        default: SIT
        type: choice
        options: [SIT, UAT]
      grep:
        description: Optional grep untuk test independen (kosong = Flow 1-6 serial)
        required: false
        type: string

jobs:
  spse:
    runs-on: qa-runner
    environment: ${{ inputs.test_environment }}
    env:
      CI: true
      ENV: ${{ inputs.test_environment }}
      PLAYWRIGHT_ENV: ${{ secrets.PLAYWRIGHT_ENV }}
      SPSE_UKPBJ_USERNAME: ${{ secrets.SPSE_UKPBJ_USERNAME }}
      SPSE_UKPBJ_PASSWORD: ${{ secrets.SPSE_UKPBJ_PASSWORD }}
      SPSE_POKJA_1_USERNAME: ${{ secrets.SPSE_POKJA_1_USERNAME }}
      SPSE_POKJA_1_PASSWORD: ${{ secrets.SPSE_POKJA_1_PASSWORD }}
      SPSE_POKJA_2_USERNAME: ${{ secrets.SPSE_POKJA_2_USERNAME }}
      SPSE_POKJA_2_PASSWORD: ${{ secrets.SPSE_POKJA_2_PASSWORD }}
      SPSE_POKJA_3_USERNAME: ${{ secrets.SPSE_POKJA_3_USERNAME }}
      SPSE_POKJA_3_PASSWORD: ${{ secrets.SPSE_POKJA_3_PASSWORD }}
      SPSE_PROVIDER_USERNAME: ${{ secrets.SPSE_PROVIDER_USERNAME }}
      SPSE_PROVIDER_PASSWORD: ${{ secrets.SPSE_PROVIDER_PASSWORD }}
      SPSE_POKJA_1_DISPLAY_NAME: ${{ vars.SPSE_POKJA_1_DISPLAY_NAME }}
      SPSE_PROVIDER_DISPLAY_NAME: ${{ vars.SPSE_PROVIDER_DISPLAY_NAME }}
      SPSE_POKJA_NAME: ${{ vars.SPSE_POKJA_NAME }}
      SPSE_POKJA_INDEX: ${{ vars.SPSE_POKJA_INDEX }}
    steps:
      - name: Validate required environment secrets
        shell: bash
        run: |
          required_secrets=(
            PLAYWRIGHT_ENV
            SPSE_UKPBJ_USERNAME
            SPSE_UKPBJ_PASSWORD
            SPSE_POKJA_1_USERNAME
            SPSE_POKJA_1_PASSWORD
            SPSE_POKJA_2_USERNAME
            SPSE_POKJA_2_PASSWORD
            SPSE_POKJA_3_USERNAME
            SPSE_POKJA_3_PASSWORD
            SPSE_PROVIDER_USERNAME
            SPSE_PROVIDER_PASSWORD
          )
          missing_secrets=()

          for secret_name in "${required_secrets[@]}"; do
            secret_value="${!secret_name}"
            if [[ -z "${secret_value//[[:space:]]/}" ]]; then
              missing_secrets+=("$secret_name")
            fi
          done

          if (( ${#missing_secrets[@]} > 0 )); then
            printf '::error::Required GitHub environment secret is empty: %s\n' \
              "${missing_secrets[@]}"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Configure environment
        run: printf '%s\n' "$PLAYWRIGHT_ENV" > packages/common-module/config/env.${{ inputs.test_environment == 'SIT' && 'sit' || 'uat' }}.json
      - run: npm ci
      - name: Run SPSE Flow 1-6 serial
        if: ${{ inputs.grep == '' }}
        run: npm run test:spse:flow1-6
      - name: Run filtered independent SPSE test
        if: ${{ inputs.grep != '' }}
        env:
          PLAYWRIGHT_GREP: ${{ inputs.grep }}
        run: npm run test:spse -- --grep="$PLAYWRIGHT_GREP" --workers=1
