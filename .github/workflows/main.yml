name: Automation test
run-name: Run ${{ github.event.inputs.test_environment }} ${{ github.event.inputs.workspace_type }} ${{ github.event.inputs.keyword }}
on:
  workflow_dispatch:
    inputs:
      workspace_type:
        description: "Please input workspace"
        type: choice
        required: true
        options:
          - api
          - web
          - android
          - ios
      test_environment:
        description: "Please input environment to test."
        type: choice
        required: true
        default: "SIT"
        options:
          - SIT
          - UAT
      workers:
        description: "Number of parallel workers for test execution"
        type: choice
        required: true
        default: "16"
        options:
          - "2"
          - "4"
          - "8"
          - "16"
      keyword:
        description: "Please input keyword. Run tests with specific tag on 📱 mobile. Example: @smoke or @regression"
        required: false
        default: ""
      run_type:
        description: "📱 [Mobile] Choose execution platform: DEVICE-FARM or LAMBDA"
        type: choice
        required: false
        default: "DEVICE-FARM"
        options:
          - DEVICE-FARM
          - LAMBDA
      app_id:
        description: "📱 [Mobile] App ID: Specify from LAMBDA or DEVICE-FARM"
        required: false
        default: ""
      spec_pattern:
        description: '📱 [Mobile] Test Pattern: WDIO spec glob (e.g., bfi-mobile/tests/**/*.spec.js)'
        required: false
        default: ""
      parallel_mode:
        description: "📱 [Mobile] Parallel Mode: split-specs or all-devices"
        type: choice
        required: false
        default: "split-specs"
        options:
          - all-devices
          - split-specs
      squad:
        description: "📱 [Mobile] Squad: Select testing squad (e.g., BFI_MOBILE)"
        type: choice
        required: false
        default: "BFI_MOBILE"
        options:
          - BFI_MOBILE
      device_name:
        description: "📱 [Mobile] Device Name: Specify from LambdaTest (optional)"
        required: false
        default: ""
      platform_version:
        description: "📱 [Mobile] Platform Version: Specify from LambdaTest (optional)"
        required: false
        default: ""

jobs:
  run-tests:
    if: ${{ github.event.inputs.workspace_type != 'android' && github.event.inputs.workspace_type != 'ios' }}
    uses: ./.github/workflows/run-tests.yml
    with:
      workspace_type: ${{ github.event.inputs.workspace_type }}
      test_environment: ${{ github.event.inputs.test_environment }}
      githost_environment: qa-runner
      keyword: ${{ github.event.inputs.keyword }}
      workers: ${{ github.event.inputs.workers }}
    secrets: inherit

  report:
    if: ${{ !cancelled() && github.event.inputs.workspace_type != 'android' && github.event.inputs.workspace_type != 'ios' }}
    needs: [run-tests]
    uses: ./.github/workflows/report.yml
    with:
      workspace_type: ${{ github.event.inputs.workspace_type }}
      test_environment: ${{ github.event.inputs.test_environment }}
      keyword: ${{ github.event.inputs.keyword }}
      scheduler: false
    secrets: inherit
  
  validate-mobile-inputs:
    if: ${{ !cancelled() && (github.event.inputs.workspace_type == 'android' || github.event.inputs.workspace_type == 'ios') }}
    runs-on: qa-runner
    steps:
      - name: Validate required mobile inputs
        run: |
          APP_ID="${{ github.event.inputs.app_id }}"
          SPEC_PATTERN="${{ github.event.inputs.spec_pattern }}"

          if [[ -z "${APP_ID// }" ]]; then
            echo "::error::Input 'app_id' is required for mobile runs. Please specify an app ID from LAMBDA or DEVICE-FARM."
            exit 1
          fi

          if [[ -z "${SPEC_PATTERN// }" ]]; then
            echo "::error::Input 'spec_pattern' is required for mobile runs. Example: bfi-mobile/tests/**/*.spec.js"
            exit 1
          fi

          echo "✅ All required mobile inputs provided:"
          echo "  app_id: $APP_ID"
          echo "  spec_pattern: $SPEC_PATTERN"

  run-mobile-tests:
    if: ${{ !cancelled() && needs.validate-mobile-inputs.result == 'success' }}
    needs: [validate-mobile-inputs]
    uses: ./.github/workflows/run-tests-mobile.yml
    with:
      run_type: ${{ github.event.inputs.run_type }}
      app_id: ${{ github.event.inputs.app_id }}
      spec_pattern: ${{ github.event.inputs.spec_pattern }}
      parallel_mode: ${{ github.event.inputs.parallel_mode }}
      squad: ${{ github.event.inputs.squad }}
      device_type: ${{ github.event.inputs.workspace_type }}
      workers: ${{ github.event.inputs.workers }}
      device_name: ${{ github.event.inputs.device_name }}
      platform_version: ${{ github.event.inputs.platform_version }}
      environment: ${{ github.event.inputs.test_environment }}
      githost_environment: qa-runner
      tag: ${{ github.event.inputs.keyword }}
    secrets: inherit

  
