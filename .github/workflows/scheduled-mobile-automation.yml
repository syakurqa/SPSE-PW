name: Scheduler Automation Tests Mobile

on:
  schedule:
    # Run daily at 00:00 GMT+7 (17:00 UTC)
    - cron: "0 17 * * 1,3,5"
  workflow_dispatch:


jobs:
  upload-android:
    name: "Upload Android App"
    uses: ./.github/workflows/upload-app-to-device-farm.yaml
    secrets: inherit
    with:
      test_environment: 'SIT'
      platform: android
      githost_environment: qa-runner

  upload-ios:
    name: "Upload iOS App"
    uses: ./.github/workflows/upload-app-to-device-farm.yaml
    secrets: inherit
    with:
      test_environment: 'SIT'
      platform: ios
      githost_environment: qa-runner

  tests-android:
    name: "Android Tests - All"
    needs: upload-android
    if: ${{ !cancelled() && needs.upload-android.result == 'success' }}
    uses: ./.github/workflows/run-tests-mobile.yml
    secrets: inherit
    with:
      run_type: DEVICE-FARM
      app_id: ${{ needs.upload-android.outputs.device_farm_app_file_name }}
      spec_pattern: bfi-mobile/tests/**/*.spec.js
      parallel_mode: split-specs
      squad: BFI_MOBILE
      device_type: android
      device_name: "Google Pixel 5"
      platform_version: "11"
      environment: 'SIT'
      githost_environment: qa-runner

  tests-ios:
    name: "iOS Tests - All"
    needs: upload-ios
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/run-tests-mobile.yml
    secrets: inherit
    with:
      run_type: DEVICE-FARM
      app_id: ${{ needs.upload-ios.outputs.device_farm_app_file_name }}
      spec_pattern: bfi-mobile/tests/**/*.spec.js
      parallel_mode: split-specs
      squad: BFI_MOBILE
      device_type: ios
      device_name: "iPhone 12"
      platform_version: "14"
      environment: 'SIT'
      githost_environment: qa-runner
