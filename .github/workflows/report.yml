name: Report Workflow

on:
  workflow_call:
    inputs:
      workspace_type:
        description: "Please input workspace"
        type: string
        required: true
      test_environment:
        description: SIT or UAT
        type: string
        required: true
      branch_name:
        description: "Branch to checkout. If empty, use the current workflow branch."
        type: string
        required: false
        default: ""
      keyword:
        description: "Please input keyword"
        type: string
        required: true
      scheduler:
        type: boolean
        required: true

jobs:
  report:
    if: ${{ !cancelled() }}
    name: Generate Test Report
    environment: ${{ inputs.test_environment }}
    env:
      ENV: ${{ inputs.test_environment }}
      WORKSPACE_DIR: packages/${{ inputs.workspace_type }}-automation
      CI: true
      GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
      KEYWORD: ${{ inputs.keyword }}
      WORKSPACE_TYPE: ${{ inputs.workspace_type }}
      SCHEDULER: ${{ inputs.scheduler }}
    runs-on: qa-runner
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch_name != '' && inputs.branch_name || github.ref_name }}

      - name: Set up NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set runner timezone to GMT+7
        uses: szenius/set-timezone@v1.2
        with:
          timezoneLinux: "Asia/Jakarta"

      - name: Set up env config from secret
        run: echo '${{ secrets.PLAYWRIGHT_ENV }}' > packages/common-module/config/env.${{ inputs.test_environment == 'SIT' && 'sit' || 'uat' }}.json

      - name: Set up db config from secret
        run: echo '${{ secrets.PLAYWRIGHT_DB }}' > packages/common-module/config/db.${{ inputs.test_environment == 'SIT' && 'sit' || 'uat' }}.json

      - name: Install dependencies
        run: npm ci

      - name: Download blob reports from GitHub Actions Artifacts
        uses: actions/download-artifact@v5
        with:
          path: ${{ env.WORKSPACE_DIR }}/all-blob-reports
          pattern: blob-report-${{ inputs.workspace_type }}-${{ github.run_attempt }}-*
          merge-multiple: true

      - name: Merge into HTML Report
        working-directory: ${{ env.WORKSPACE_DIR }}
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Merge into JSON Report
        working-directory: ${{ env.WORKSPACE_DIR }}
        run: npx playwright merge-reports --reporter json ./all-blob-reports > "./playwright-report/test-${{ inputs.workspace_type }}-${{ github.run_attempt }}-results.json"

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: html-report-attempt-${{ inputs.workspace_type }}-${{ github.run_attempt }}-${{ github.run_id }}
          path: ${{ env.WORKSPACE_DIR }}/playwright-report
          retention-days: 30

      - name: Integrate Test Cycle Report
        if: always()
        working-directory: ${{ env.WORKSPACE_DIR }}
        run: |
          set -euo pipefail
          npm run zephyr:test-cycle:playwright -- -- --report-file-name="test-${{ inputs.workspace_type }}-${{ github.run_attempt }}-results.json" --type=${{inputs.workspace_type}} --test-cycle-name="[${{ github.run_number }}#${{github.run_attempt}}] Automation Report"

      - name: Write Execution Results to DB
        if: always() && inputs.scheduler == true
        run: |
          npm run reporting:execution:write --workspace=packages/common-module -- --report-file-name="test-${{ inputs.workspace_type }}-${{ github.run_attempt }}-results.json" --type=${{ inputs.workspace_type }} --trigger-type=${{ inputs.scheduler && 'scheduled' || 'manual' }}
        env:
          NODE_ENV: prod
          DB_USERNAME: ${{ secrets.REPORTING_DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.REPORTING_DB_PASSWORD }}
          DB_HOST: ${{ secrets.REPORTING_DB_HOST }}
          DB_DATABASE_NAME: ${{ secrets.REPORTING_DB_NAME }}
          DB_PORT: ${{ secrets.REPORTING_DB_PORT }}
          DB_SCHEMA: ${{ secrets.REPORTING_DB_SCHEMA }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
