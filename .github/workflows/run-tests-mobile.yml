name: Mobile Automation Test
on:
  workflow_call:
    inputs:
      run_type:
        description: 'DEVICE-FARM or LAMBDA'
        type: string
        required: true
      app_id:
        description: 'Please specify the app id from LAMBDA / DEVICE-FARM.'
        type: string
        required: true
      spec_pattern:
        description: 'WDIO spec glob pattern. Example: bfi-mobile/tests/**/*.spec.js'
        type: string
        required: true
      tag:
        description: 'Run tests with specific tag. Example: @smoke or @regression'
        type: string
        required: false
        default: ''
      parallel_mode:
        description: 'Please specify the parallel mode split-specs / all-devices'
        type: string
        required: true
      workers:
        description: 'Number of parallel workers'
        type: string
        required: false
        default: "2"
      squad:
        description: 'Please input squad. Example: BFI_MOBILE, etc'
        type: string
        required: true
      device_type:
        description: 'android or ios'
        type: string
        required: true
      device_name:
        description: 'Please specify the device name from Lambdatest.'
        type: string
        required: false
      platform_version:
        description: 'Please specify the platform version from Lambdatest.'
        type: string
        required: false
      environment:
        description: 'Please specify the environment SIT or UAT'
        type: string
        required: true
      githost_environment:
        description: 'GitHub runner environment (e.g., qa-runner)'
        type: string
        required: false
        default: 'qa-runner'
    secrets:
      GOOGLE_CHAT_WEBHOOK_URL:
        required: true
      PLAYWRIGHT_ENV:
        required: true
      PLAYWRIGHT_DB:
        required: true
      MOBILE_ENV:
        required: true
  workflow_dispatch:
    inputs:
      run_type:
          description: 'Execution provider: DEVICE-FARM or LAMBDA'
          type: choice
          required: true
          default: 'DEVICE-FARM'
          options:
            - DEVICE-FARM
            - LAMBDA
      app_id:
        description: 'For LambdaTest: app ID (e.g. lt://APP...). For Device Farm: app file name uploaded to the device farm.'
        required: true
        default: ''
      spec_pattern:
        description: 'WDIO spec glob pattern. Example: bfi-mobile/tests/**/*.spec.js or **/**/account.spec.js'
        required: true
        default: ''
      parallel_mode:
        description: 'Spec distribution mode: split-specs distributes specs across devices, all-devices runs all specs on each device'
        type: choice
        required: true
        default: 'split-specs'
        options:
          - all-devices
          - split-specs
      workers:
        description: 'Number of parallel workers'
        type: string
        required: false
        default: "2"
      squad:
        description: 'Target mobile app or squad configuration'
        type: choice
        required: true
        default: ''
        options:
          - BFI_MOBILE
      device_type:
        description: 'Target platform: android or ios'
        type: choice
        required: true
        default: 'android'
        options:
          - android
          - ios
      device_name:
        description: 'Optional LambdaTest device name. Required if platform_version is empty.'
        required: false
        default: ''
      platform_version:
        description: 'Optional LambdaTest OS version. Required if device_name is empty.'
        required: false
        default: ''
      environment:
        description: 'Config profile to load for ENV and secret-backed config files: SIT or UAT'
        type: choice
        required: true
        default: 'SIT'
        options:
          - SIT
          - UAT

jobs:
  RunTest:
    if: ${{ !cancelled() }}
    name: Run test for ${{ inputs.squad }} squad
    environment: ${{ inputs.environment }}
    runs-on: ${{ inputs.githost_environment }}
    env:
      ENV: ${{ inputs.environment }}
      CI: true
      WORKSPACE_TYPE: mobile
      KEYWORD: ${{ inputs.spec_pattern }}
      SCHEDULER: false
      GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
    steps:
      - name: Set up NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Dependencies
        run: npm i

      - name: Clean previous mobile reports
        run: rm -rf packages/mobile-automation/reports/*

      - name: Validate workflow inputs
        run: |
          RUN_TYPE="${{ inputs.run_type }}"
          APP_ID="${{ inputs.app_id }}"
          SPEC_PATTERN="${{ inputs.spec_pattern }}"
          DEVICE_NAME="${{ inputs.device_name }}"
          PLATFORM_VERSION="${{ inputs.platform_version }}"

          if [[ -z "${APP_ID// }" ]]; then
            echo "::error::Input 'app_id' is required and cannot be empty. Please specify an app ID from LAMBDA or DEVICE-FARM."
            exit 1
          fi

          if [[ -z "${SPEC_PATTERN// }" ]]; then
            echo "::error::Input 'spec_pattern' is required and cannot be empty."
            exit 1
          fi

          if [[ "$RUN_TYPE" == "LAMBDA" ]] && [[ -z "${DEVICE_NAME// }" ]] && [[ -z "${PLATFORM_VERSION// }" ]]; then
            echo "::error::For LAMBDA run_type, provide at least one of 'device_name' or 'platform_version'."
            exit 1
          fi

      - name: Set up env files from secrets
        run: |
          ENV_LOWER=$(echo "${{ inputs.environment }}" | tr '[:upper:]' '[:lower:]')
          echo '${{ secrets.PLAYWRIGHT_ENV }}' > packages/common-module/config/env.${ENV_LOWER}.json
          echo '${{ secrets.PLAYWRIGHT_DB }}' > packages/common-module/config/db.${ENV_LOWER}.json
          echo '${{ secrets.MOBILE_ENV }}' > packages/common-module/config/mobile.env.${ENV_LOWER}.json

      - name: WDIO run on LambdaTest
        if: ${{ inputs.run_type == 'LAMBDA' }}
        run: |
          PARALLEL=${{ inputs.workers }} RUN_TYPE=LAMBDA APP=${{ inputs.app_id }} DEVICE_TYPE=${{ inputs.device_type }} DEVICE_NAME="${{ inputs.device_name }}" PLATFORM_VERSION="${{ inputs.platform_version }}" SQUAD=${{ inputs.squad }} SPEC_PATTERN="${{ inputs.spec_pattern }}" PARALLEL_MODE=${{ inputs.parallel_mode }} TAG="${{ inputs.tag }}" npm run test:mobile

      - name: WDIO run on Device Farm
        if: ${{ inputs.run_type == 'DEVICE-FARM' }}
        run: |
          PARALLEL=${{ inputs.workers }} RUN_TYPE=DEVICE-FARM APP=${{ inputs.app_id }} DEVICE_TYPE=${{ inputs.device_type }} SQUAD=${{ inputs.squad }} SPEC_PATTERN="${{ inputs.spec_pattern }}" PARALLEL_MODE=${{ inputs.parallel_mode }} TAG="${{ inputs.tag }}" npm run test:mobile

      - name: Upload Mobile report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: packages/mobile-automation/reports
          retention-days: 30

      - name: Integrate Test Cycle Report per device
        if: always()
        run: |
          set -euo pipefail
          REPORTS_DIR="packages/mobile-automation/reports"
          REPORT_FILES=$(find "$REPORTS_DIR" -maxdepth 1 -type f -name 'device-*-merged.json' | sort | tr '\n' ',' | sed 's/,$//')
          if [[ -z "$REPORT_FILES" ]]; then
            echo "::error::No merged Mochawesome report JSON found in $REPORTS_DIR"
            exit 1
          fi
          # Convert full paths to file names only (comma-separated)
          FILE_NAMES=$(echo "$REPORT_FILES" | tr ',' '\n' | xargs -I{} basename {} | tr '\n' ',' | sed 's/,$//')
          echo "Processing reports: $FILE_NAMES"

          GITHUB_WORKFLOW="${{ github.workflow }}" \
            npm run zephyr:test-cycle:playwright --workspace=@automation/common-module -- \
            --report-file-names="$FILE_NAMES" \
            --type=mobile \
            --test-cycle-name="[${{ github.run_number }}#${{ github.run_attempt }}] Mobile Automation Report"


