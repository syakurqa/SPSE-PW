name: Coverage Monitoring - Daily Sync

on:
  schedule:
    # Run daily at 01:00 GMT+7 (18:00 UTC)
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  coverage-sync:
    name: "Sync Automation Coverage from Zephyr"
    runs-on: qa-mac-mini
    environment: SIT
    env:
      ENV: SIT
      CI: true
      NODE_ENV: prod
      DB_USERNAME: ${{ secrets.REPORTING_DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.REPORTING_DB_PASSWORD }}
      DB_HOST: ${{ secrets.REPORTING_DB_HOST }}
      DB_DATABASE_NAME: ${{ secrets.REPORTING_DB_NAME }}
      DB_PORT: ${{ secrets.REPORTING_DB_PORT }}
      DB_SCHEMA: ${{ secrets.REPORTING_DB_SCHEMA }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set runner timezone to GMT+7
        uses: szenius/set-timezone@v1.2
        with:
          timezoneLinux: "Asia/Jakarta"

      - name: Set up env config from secret
        run: echo '${{ secrets.PLAYWRIGHT_ENV }}' > packages/common-module/config/env.sit.json

      - name: Set up db config from secret
        run: echo '${{ secrets.PLAYWRIGHT_DB }}' > packages/common-module/config/db.sit.json

      - name: Install dependencies
        run: npm ci

      - name: Run Coverage Sync
        run: npm run reporting:coverage:sync --workspace=packages/common-module

      - name: Run Member Contribution Sync
        run: npm run reporting:contribution:sync --workspace=packages/common-module

      - name: Run Jira Issue Sync
        run: npm run reporting:jira:sync --workspace=packages/common-module -- --full --since 2026-01-01 2>&1
